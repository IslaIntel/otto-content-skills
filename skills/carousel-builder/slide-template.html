<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carousel slides</title>
<!--
  Carousel slide template (Otto Content Skills).
  Fill the JSON block below; don't redesign the layout. Each slide renders at 1080x1350.
  Export: screenshot each element with class "slide" (id slide-1, slide-2, ...) at 1080x1350.
  Add ?export=1 to the URL to hide the preview chrome (header, footer, Otto mark) before exporting.
  The Otto mark lives in the preview chrome only. It is never drawn on a slide.
-->
<style>
  :root {
    --bg: #ffffff; --ink: #111111; --accent: #ff5a1f; --muted: #6b6b6b; --soft: #f3f1ee;
    --font-head: "Inter", system-ui, sans-serif; --font-body: "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #e9e7e3; font-family: var(--font-body); color: var(--ink); }
  .chrome { max-width: 1200px; margin: 0 auto; padding: 16px; display: flex; justify-content: space-between; align-items: center; font: 600 14px system-ui, sans-serif; color: #444; }
  .chrome .mark { font-weight: 800; letter-spacing: .02em; }
  .deck { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; padding: 16px; }
  .frame { width: 360px; height: 450px; overflow: hidden; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.12); }
  .frame .slide { transform: scale(.3333); transform-origin: top left; }
  body.export { background: none; }
  body.export .chrome { display: none; }
  body.export .deck { display: block; padding: 0; }
  body.export .frame { width: 1080px; height: 1350px; border-radius: 0; box-shadow: none; }
  body.export .frame .slide { transform: none; }

  .slide { width: 1080px; height: 1350px; position: relative; background: var(--bg); color: var(--ink); padding: 120px 96px; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
  .slide h1 { font: 800 96px/1.05 var(--font-head); letter-spacing: -.02em; }
  .slide h2 { font: 800 72px/1.1 var(--font-head); letter-spacing: -.01em; margin-bottom: 40px; }
  .slide p { font: 400 40px/1.4 var(--font-body); color: var(--muted); max-width: 860px; }
  .slide .num { position: absolute; right: 72px; bottom: 64px; font: 600 28px var(--font-body); color: var(--muted); }
  .slide .swipe { position: absolute; right: 72px; bottom: 64px; font: 700 30px var(--font-body); color: var(--accent); }
  .slide .photo { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .slide .photo + .scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(0,0,0,.75) 100%); }
  .slide .content { position: relative; }

  /* Presets */
  .clean h1, .clean h2 { color: var(--ink); }
  .bold { background: var(--accent); color: #fff; }
  .bold h1, .bold h2 { color: #fff; font-size: 120px; line-height: 1; }
  .bold p, .bold .num, .bold .swipe { color: rgba(255,255,255,.9); }
  .stat .big { font: 900 300px/0.9 var(--font-head); color: var(--accent); letter-spacing: -.04em; margin-bottom: 32px; }
  .checklist ul { list-style: none; }
  .checklist li { font: 500 44px/1.3 var(--font-body); padding: 22px 0 22px 84px; position: relative; border-bottom: 2px solid var(--soft); }
  .checklist li::before { content: ""; position: absolute; left: 0; top: 26px; width: 48px; height: 48px; border-radius: 10px; background: var(--accent); }
  .checklist li::after { content: ""; position: absolute; left: 15px; top: 34px; width: 14px; height: 24px; border: solid #fff; border-width: 0 6px 6px 0; transform: rotate(45deg); }
  .beforeafter { padding: 0; }
  .beforeafter .half { flex: 1; padding: 72px 96px; display: flex; flex-direction: column; justify-content: center; }
  .beforeafter .half:first-child { background: var(--soft); }
  .beforeafter .label { font: 800 30px var(--font-body); text-transform: uppercase; letter-spacing: .12em; color: var(--accent); margin-bottom: 20px; }
  .beforeafter .half p { color: var(--ink); font-size: 46px; }
  .with-photo h1, .with-photo h2, .with-photo p { color: #fff; }
  .with-photo { justify-content: flex-end; }
</style>
</head>
<body>
<div class="chrome"><span class="mark">Otto</span><span id="meta"></span></div>
<div class="deck" id="deck"></div>
<div class="chrome"><span>Made with Otto Content Skills · ottowebmaster.com</span><span>Preview only. Exported slides carry no Otto mark.</span></div>

<!--
  Fill this block. Presets: "clean", "bold", "stat", "checklist", "beforeafter".
  Fields: headline, body (string), big (stat only), items (checklist), before/after (beforeafter),
  photo (optional URL or relative path, only photos the user supplied).
-->
<script type="application/json" id="slides">
{
  "title": "Example: 5 signs your boiler needs a service",
  "brand": { "bg": "#ffffff", "ink": "#111111", "accent": "#ff5a1f", "muted": "#6b6b6b", "soft": "#f3f1ee",
             "fontHead": "Inter", "fontBody": "Inter", "googleFonts": "Inter:wght@400;500;600;700;800;900" },
  "swipeCue": "Swipe →",
  "slides": [
    { "preset": "bold", "headline": "5 signs your boiler needs a service before winter" },
    { "preset": "clean", "headline": "Most breakdowns give a warning first", "body": "Catch these early and a service costs less than a call-out." },
    { "preset": "stat", "big": "1 in 3", "headline": "call-outs we see could have waited for a service", "body": "Source: owner, from last winter's jobs." },
    { "preset": "beforeafter", "before": "Pilot light flickers yellow", "after": "Steady blue flame after a clean" },
    { "preset": "checklist", "headline": "Check this weekend", "items": ["Yellow or flickering flame", "Banging or whistling", "Pressure drops below 1 bar", "Radiators cold at the top", "Higher bills, same use"] },
    { "preset": "clean", "headline": "Ticked two or more?", "body": "Book a service. Link in bio." }
  ]
}
</script>
<script>
(function () {
  var data = JSON.parse(document.getElementById('slides').textContent);
  var b = data.brand || {};
  var root = document.documentElement.style;
  if (b.bg) root.setProperty('--bg', b.bg);
  if (b.ink) root.setProperty('--ink', b.ink);
  if (b.accent) root.setProperty('--accent', b.accent);
  if (b.muted) root.setProperty('--muted', b.muted);
  if (b.soft) root.setProperty('--soft', b.soft);
  if (b.fontHead) root.setProperty('--font-head', '"' + b.fontHead + '", system-ui, sans-serif');
  if (b.fontBody) root.setProperty('--font-body', '"' + b.fontBody + '", system-ui, sans-serif');
  if (b.googleFonts) {
    var l = document.createElement('link');
    l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=' + b.googleFonts.replace(/ /g, '+') + '&display=swap';
    document.head.appendChild(l);
  }
  if (/[?&]export=1/.test(location.search)) document.body.classList.add('export');

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  var deck = document.getElementById('deck');
  var n = data.slides.length;
  document.getElementById('meta').textContent = (data.title || 'Carousel') + ' · ' + n + ' slides · 1080x1350';

  data.slides.forEach(function (s, i) {
    var frame = el('div', 'frame');
    var slide = el('div', 'slide ' + (s.preset || 'clean'));
    slide.id = 'slide-' + (i + 1);
    if (s.photo) {
      slide.classList.add('with-photo');
      var ph = el('div', 'photo'); ph.style.backgroundImage = 'url("' + s.photo + '")';
      slide.appendChild(ph); slide.appendChild(el('div', 'scrim'));
    }
    var c = el('div', 'content');
    if (s.preset === 'beforeafter') {
      slide.style.flexDirection = 'column';
      [['Before', s.before], ['After', s.after]].forEach(function (pair) {
        var h = el('div', 'half'); h.appendChild(el('div', 'label', pair[0])); h.appendChild(el('p', null, pair[1] || '')); slide.appendChild(h);
      });
    } else {
      if (s.preset === 'stat' && s.big) c.appendChild(el('div', 'big', s.big));
      if (s.headline) c.appendChild(el(i === 0 ? 'h1' : 'h2', null, s.headline));
      if (s.preset === 'checklist' && s.items) {
        var ul = el('ul'); s.items.forEach(function (t) { ul.appendChild(el('li', null, t)); }); c.appendChild(ul);
      }
      if (s.body) c.appendChild(el('p', null, s.body));
      slide.appendChild(c);
    }
    if (i === 0 && data.swipeCue) slide.appendChild(el('div', 'swipe', data.swipeCue));
    else slide.appendChild(el('div', 'num', (i + 1) + '/' + n));
    frame.appendChild(slide);
    deck.appendChild(frame);
  });
})();
</script>
</body>
</html>
