<!doctype html>
<html><head><meta charset="utf-8">
<style>
  /* README banner and GitHub social preview (1280x640). Rendered to assets/ by templates/make_assets.py */
  html,body{margin:0}
  body{width:1280px;height:640px;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       background:radial-gradient(1200px 600px at 85% 30%,#13314a 0%,#0b0f14 55%),#0b0f14;color:#f0efec;position:relative}
  .l{position:absolute;left:72px;top:96px;width:560px}
  .brand{display:flex;align-items:center;gap:14px;margin-bottom:44px}
  .brand svg{height:46px;color:#f0efec}
  h1{font-size:54px;line-height:1.06;letter-spacing:-.03em;margin:0 0 22px;font-weight:800}
  h1 em{font-style:normal;color:#45adf5}
  p{font-size:22px;line-height:1.45;color:#c3c2b7;margin:0 0 30px}
  .chips{display:flex;gap:10px;flex-wrap:wrap}
  .chips span{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);font-size:16px;font-weight:600}
  .chips i{width:9px;height:9px;border-radius:50%}
  .shot{position:absolute;right:-90px;top:28px;width:700px;border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08);transform:perspective(1600px) rotateY(-14deg) rotateX(4deg)}
  .shot img{width:100%;display:block}
  .shot2{position:absolute;right:330px;top:350px;width:300px;border-radius:14px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.1);transform:perspective(1400px) rotateY(-10deg)}
  .shot2 img{width:100%;display:block}
  /* Otto leans on the diagnosis panel: paw on its right edge, feet near the bottom */
  .mascot{position:absolute;left:947px;bottom:6px;height:262px;filter:drop-shadow(0 18px 30px rgba(0,0,0,.5))}
</style></head>
<body>
  <div class="l">
    <div class="brand">__WORDMARK__</div>
    <h1>Content skills for Claude, run on <em>your real numbers</em></h1>
    <p>38 free skills that read your Instagram, Facebook, YouTube, LinkedIn, Google Analytics and Search Console through Otto.</p>
    <div class="chips"><span><i style="background:#c64fb6"></i>Dashboards</span><span><i style="background:#3b8bf5"></i>Reel diagnosis</span><span><i style="background:#ef4a40"></i>Hooks &amp; scripts</span></div>
  </div>
  <div class="shot"><img src="__SHOT__" alt=""></div>
  <div class="shot2"><img src="__SHOT2__" alt=""></div>
  <img class="mascot" src="__MASCOT__" alt="">
</body></html>
